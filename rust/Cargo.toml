[workspace]
members = [
    "crates/bridge-protocol",
    "crates/mt5-wire",
    "crates/mt5-windows",
    "crates/bridge-runtime",
    "crates/mt5-bridge",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
hex = "0.4"
prost = "0.14"
rand = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
